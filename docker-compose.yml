services:
  # ─── Base de données PostgreSQL ───────────────
  postgres:
    image: postgres:18-alpine
    container_name: fsaip_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: plateforme_securisee
      POSTGRES_USER: fsaip_user
      POSTGRES_PASSWORD: fsaip_password
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsaip_user -d plateforme_securisee"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Backend Node.js ──────────────────────────
  backend:
    build: ./backend
    container_name: fsaip_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: plateforme_securisee
      DB_USER: fsaip_user
      DB_PASSWORD: fsaip_password
      JWT_SECRET: un_secret_long_et_complexe_pour_le_poc_fsaip_2026
      ENCRYPT_KEY: a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2
      NAS_PATH: ./storage
      EMAIL_MODE: dev
      EMAIL_FROM: noreply@fsaip.fr
    volumes:
      - backend_storage:/app/storage
      - backend_logs:/app/logs
      - ./frontend:/frontend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  backend_storage:
  backend_logs:
